<!DOCTYPE html><html><head><title>Asset Fixer</title></head><body><h2>Processing Screenshots to 1080x1920... Check Downloads!</h2><script>function resizeAndDownload(imgSrc, filename, targetWidth, targetHeight) { var img = new Image(); img.onload = function() { var canvas = document.createElement("canvas"); canvas.width = targetWidth; canvas.height = targetHeight; var ctx = canvas.getContext("2d"); ctx.fillStyle = "black"; ctx.fillRect(0, 0, targetWidth, targetHeight); var scale = Math.min(targetWidth / img.width, targetHeight / img.height); var x = (targetWidth / 2) - (img.width / 2) * scale; var y = (targetHeight / 2) - (img.height / 2) * scale; ctx.drawImage(img, x, y, img.width * scale, img.height * scale); var a = document.createElement("a"); a.download = filename; a.href = canvas.toDataURL("image/jpeg", 1.0); document.body.appendChild(a); a.click(); document.body.removeChild(a); }; img.src = imgSrc; } setTimeout(() => resizeAndDownload("ss1.jpg", "screenshot1_1080x1920.jpg", 1080, 1920), 500); setTimeout(() => resizeAndDownload("ss2.jpg", "screenshot2_1080x1920.jpg", 1080, 1920), 1000); setTimeout(() => resizeAndDownload("ss3.jpg", "screenshot3_1080x1920.jpg", 1080, 1920), 1500);</script></body></html>
